name: CI
on:
  pull_request:
  push: { branches: master }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'ruby-head']
    continue-on-error: ${{ matrix.ruby-version == 'ruby-head' }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run Tests
        run: bundle exec rake test
        env:
          RUBYOPT: "--enable=frozen_string_literal"
  test-legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.3', '2.4', '2.5']
    steps:
      - uses: actions/checkout@v3
      # Plain docker run rather than container: the ruby:2.3/2.4 images' glibc is too old for the actions' Node.
      # Not rake test: the Rakefile loads changelogd, which these Rubies can't install.
      # No frozen_string_literal: net-ssh 6 mutates string literals.
      - name: Run Tests
        run: >-
          docker run --rm -v "$PWD:/w" -w /w -e BUNDLE_GEMFILE=gemfiles/legacy.gemfile ruby:${{ matrix.ruby-version }}
          sh -c 'bundle install --jobs 4 && bundle exec ruby -Ilib -Itest -e "Dir.glob(\"./test/test_*.rb\").each { |f| require f }"'
